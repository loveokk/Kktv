<!doctype html>
<html lang="zh-CN" class="dark font-sans" style="color-scheme: dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Kktv AI 影视与短剧创作工作台" />
        <link rel="icon" href="/kktv-icon.png" type="image/png" />
        <title>Kktv</title>
        <style>
            html,
            body {
                margin: 0;
                background: var(--background, #0f0f0f);
            }
            #root:empty {
                position: fixed;
                inset: 0;
                min-height: 100vh;
                overflow: hidden;
                background: #090909;
            }
            #root:empty::after {
                content: "";
                position: absolute;
                left: 50%;
                top: 50%;
                width: min(180px, 42vw);
                aspect-ratio: 1;
                transform: translate(-50%, -50%);
                background: url('/kktv-icon.png') center / cover no-repeat;
                border-radius: 28px;
                box-shadow: 0 0 80px rgba(220, 60, 60, .18);
                animation: appearance-bootstrap-breathe 2.8s ease-in-out infinite;
            }
            @keyframes appearance-bootstrap-breathe {
                0%, 100% { transform: translate(-50%, -50%) scale(.97); }
                50% { transform: translate(-50%, -50%) scale(1.035); }
            }
            @media (prefers-reduced-motion: reduce) {
                #root:empty::after {
                    animation: none;
                }
            }
        </style>
        <script>
            // Match the saved preference before the first paint; invalid storage stays dark.
            let theme = "dark";
            try {
                if (JSON.parse(localStorage.getItem("infinite-canvas:theme_store"))?.state?.theme === "light") theme = "light";
            } catch {}
            document.documentElement.classList.toggle("dark", theme === "dark");
            document.documentElement.style.colorScheme = theme;
            document.documentElement.style.setProperty("--background", theme === "dark" ? "#0f0f0f" : "#f5f5f5");
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
