name: kktv-deploy

services:
  backend:
    image: kktv-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    container_name: kktv-deploy-backend-1
    restart: unless-stopped
    environment:
      CANVAS_CHANNEL_CONCURRENCY: "3"
      DATABASE_URL: ""
      GIN_MODE: "release"
      CANVAS_LOCAL_MODE: "true"
      CANVAS_REGISTRATION_ENABLED: "false"
      ENABLE_PROVIDER_PLUGINS: "true"
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_CORS_ORIGINS: "http://localhost:3000"
      CANVAS_DATABASE_DRIVER: "sqlite"
      CANVAS_BACKEND_DATA_DIR: "/data"
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ""
      CANVAS_SHUTDOWN_TIMEOUT: "10m"
      CANVAS_WORKER_CONCURRENCY: "3"
      REDIS_URL: ""
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    image: kktv-web:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kktv-deploy-web-1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  backend-data:
    name: kktv-deploy_backend-data
